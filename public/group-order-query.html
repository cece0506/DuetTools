<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>拼团订单查询工具 - Duet</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/assets/css/global-navigation.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/filepond@4/dist/filepond.min.css" />
    <link rel="stylesheet" href="/assets/css/group-order-query.css" />
  </head>
  <body>
    <div class="site-shell group-tool-shell">
      <nav class="top-nav" data-global-top-nav></nav>
      <aside class="side-nav" aria-label="侧边导航" data-global-side-nav></aside>

      <main class="group-tool-page">
        <section class="group-hero">
          <div>
            <p class="group-kicker">Group Buying Utility</p>
            <h1>拼团订单查询工具</h1>
            <p>
              上传拼团订单截图，自动识别店铺和商品信息，按店铺聚合成树形表格，并支持 Excel
              导入导出与图表统计。
            </p>
          </div>
          <div class="group-hero-badges" aria-label="核心能力">
            <span>OCR 识别</span>
            <span>树形聚合</span>
            <span>Excel 导入导出</span>
            <span>图表嵌入导出</span>
          </div>
        </section>

        <section class="group-layout">
          <aside class="group-panel">
            <h2>数据导入</h2>
            <label class="field">
              <span>导入策略</span>
              <select id="import-mode">
                <option value="append" selected>续写（在当前表格后追加）</option>
                <option value="replace">覆盖（清空后导入）</option>
              </select>
            </label>

            <label class="field">
              <span>上传订单截图（可多选）</span>
              <input id="image-input" type="file" accept="image/*" multiple hidden />
              <input id="image-input-ui" type="file" accept="image/*" multiple />
            </label>

            <div class="clipboard-panel" id="clipboard-panel" tabindex="0">
              <p>支持剪贴板上传：复制图片后按 Ctrl+V（或点击此区域后粘贴）</p>
              <button id="paste-trigger" type="button" class="btn">我已复制图片，点击后粘贴</button>
            </div>

            <div class="panel-actions">
              <button id="parse-images" type="button" class="btn primary">识别图片并入表</button>
            </div>

            <label class="field">
              <span>导入 Excel</span>
              <input id="excel-input" type="file" accept=".xlsx,.xls" hidden />
              <input id="excel-input-ui" type="file" accept=".xlsx,.xls" />
            </label>

            <div class="panel-actions two-col">
              <button id="import-excel" type="button" class="btn">导入 Excel</button>
              <button id="export-excel" type="button" class="btn">导出 Excel</button>
            </div>

            <h2>状态批量修改</h2>
            <label class="field">
              <span>店铺</span>
              <select id="store-selector">
                <option value="">请选择店铺</option>
              </select>
            </label>

            <label class="field">
              <span>商品状态</span>
              <select id="status-selector">
                <option value="备货中" selected>备货中</option>
                <option value="已到货">已到货</option>
              </select>
            </label>

            <div class="panel-actions">
              <button id="apply-status" type="button" class="btn">按店铺批量修改</button>
            </div>

            <h2>辅助</h2>
            <div class="panel-actions two-col">
              <button id="toggle-all" type="button" class="btn">展开/收起全部</button>
              <button id="clear-data" type="button" class="btn danger">清空数据</button>
            </div>
            <p id="status-text" class="status-text" aria-live="polite">等待操作</p>
            <progress id="ocr-progress" value="0" max="1"></progress>
          </aside>

          <section class="group-main">
            <article class="group-card table-card">
              <div class="card-head">
                <h2>订单树形表格</h2>
                <p id="data-summary">当前无数据</p>
              </div>
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>店铺 / 商品</th>
                      <th>订单状态</th>
                      <th>数量</th>
                      <th>单价</th>
                      <th>规格</th>
                      <th>商品状态</th>
                      <th>总价</th>
                    </tr>
                  </thead>
                  <tbody id="order-table-body"></tbody>
                </table>
              </div>
            </article>

            <article class="group-card chart-card">
              <div class="card-head">
                <h2>数据可视化</h2>
                <p>图表会同步导出到 Excel 的统计页</p>
              </div>
              <div class="chart-grid">
                <div id="chart-store-status" class="chart"></div>
                <div id="chart-order-status" class="chart"></div>
              </div>
            </article>
          </section>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/filepond@4/dist/filepond.min.js"></script>

    <script type="module" src="/assets/js/global-navigation.js"></script>
    <script type="module" src="/assets/js/group-order-query.js"></script>
  </body>
</html>
