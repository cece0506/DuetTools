name = "group-order-ocr-proxy"
main = "worker.js"
compatibility_date = "2026-04-20"

[vars]
# baidu | tongyi
OCR_PROVIDER = "baidu"
# 生产建议改成你的前端域名，例如 https://tools.example.com
CORS_ORIGIN = "*"
# 通义模型可按需调整
TONGYI_MODEL = "qwen-vl-max-latest"

# 下面这些是密钥，不要写在文件里。
# 使用命令写入：
# wrangler secret put BAIDU_API_KEY
# wrangler secret put BAIDU_SECRET_KEY
# wrangler secret put TONGYI_API_KEY
